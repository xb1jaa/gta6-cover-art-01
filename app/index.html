<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio — GTA 6-style cover art maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h1>Vice Cover Studio</h1>
    <p class="tag">Your photo + a caption, made into GTA-style poster art. Everything runs on your machine — no upload.</p>

    <h2>Caption</h2>
    <label>Title <input id="caption" type="text" maxlength="30" value="Sunset Heist"></label>
    <label>Subtitle <input id="sub" type="text" maxlength="30" value="Leonida Nights"></label>

    <h2>Layout</h2>
    <div id="layouts" class="chips" role="group" aria-label="Layout"></div>

    <h2>Colour grade</h2>
    <div id="grades" class="chips" role="group" aria-label="Colour grade"></div>

    <h2>Lettering</h2>
    <div id="letterings" class="chips" role="group" aria-label="Lettering"></div>

    <h2>Photos</h2>
    <p class="hint">Pick a panel, then drag on the cover to move its photo and scroll to zoom it.</p>
    <div class="panels" role="group" aria-label="Panels">
      <button type="button" class="panel-btn active" data-panel="0">Panel 1</button>
      <button type="button" class="panel-btn" data-panel="1">Panel 2</button>
      <button type="button" class="panel-btn" data-panel="2">Panel 3</button>
      <button type="button" class="panel-btn" data-panel="3">Panel 4</button>
    </div>
    <div class="uploads">
      <label>Panel 1 <input type="file" accept="image/*" data-photo="0"></label>
      <label>Panel 2 <input type="file" accept="image/*" data-photo="1"></label>
      <label>Panel 3 <input type="file" accept="image/*" data-photo="2"></label>
      <label>Panel 4 <input type="file" accept="image/*" data-photo="3"></label>
    </div>
    <div class="row">
      <button id="loadSample" type="button">Load sample photo</button>
      <button id="clearPhotos" type="button">Clear photos</button>
    </div>

    <h2>Export size</h2>
    <div id="sizes" class="chips" role="group" aria-label="Export size"></div>
    <button id="export" type="button" class="export">Export PNG</button>
    <p id="status" role="status"></p>
  </section>
  <section class="preview" aria-label="Cover preview">
    <canvas id="cover" width="1080" height="1080" aria-label="The cover"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
